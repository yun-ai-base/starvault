<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>StarVault · X 博主精选画廊</title>
<meta name="description" content="X (Twitter) 创作者精选画廊:去重备份、实时探索与精选推荐。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://wsrv.nl" crossorigin>
<link rel="preconnect" href="https://unavatar.io" crossorigin>
<link rel="preconnect" href="https://pbs.twimg.com" crossorigin>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<a class="skip-link" href="#main">跳到主内容</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5l2.6 6.9 6.9 2.6-6.9 2.6L12 21.5l-2.6-6.9L2.5 12l6.9-2.6z" fill="#fff" opacity=".95"/><circle cx="18.6" cy="5.4" r="1.7" fill="#fff" opacity=".75"/></svg>
      </span>
      <span class="brand__name">StarVault</span>
    </a>

    <div class="search search--top" id="search-wrap">
      <span class="search__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.6"/><path d="M16 16l4.5 4.5"/></svg>
      </span>
      <input id="q" type="search" placeholder="搜索博主 ID (@handle)、昵称或简介 Bio…" autocomplete="off" aria-label="搜索">
      <button class="search__clear" id="btn-clear-q" type="button" title="清除" hidden>×</button>
      <kbd class="search__kbd" aria-hidden="true">/</kbd>
    </div>

    <div class="topbar__tools">
      <button class="btn btn--glow btn--pill" id="btn-random" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="8.4" cy="8.4" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.6" cy="15.6" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span class="btn__label">随机探索</span>
      </button>
      <button class="icon-btn icon-btn--round" id="btn-theme" type="button" title="切换主题 (T)" aria-label="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ============ 画廊视图 ============ -->
  <section class="view" id="view-vault">

    <div class="hero">
      <div class="hero__copy">
        <p class="eyebrow"><span class="eyebrow__star" aria-hidden="true">✦</span> CURATED DISCOVERY VAULT</p>
        <h1><span class="hero__x">X</span><span class="hero__cn">博主精选画廊</span></h1>
        <p class="hero__sub">高品质 X (Twitter) 创作者画廊 · 去重备份 · 实时探索与智能推荐</p>
        <div class="stats" id="stats" aria-label="统计概览"></div>
      </div>

      <aside class="spotlight" id="spotlight" aria-live="polite">
        <p class="spotlight__label">
          <span class="spotlight__star" aria-hidden="true">★</span> 今日精选 <em>Spotlight</em>
        </p>
        <div class="spotlight__body" id="spotlight-body">
          <p class="muted">还没有可展示的内容,刷新页面试试。</p>
        </div>
        <button class="btn btn--ghost btn--pill" id="btn-reroll" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.4 5.7"/><path d="M20 5v6h-6"/></svg>
          换一位推荐
        </button>
      </aside>
    </div>

    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="分类筛选"></div>
      <div class="viewtoggle" role="group" aria-label="视图切换">
        <button class="vt is-active" id="vt-grid" type="button" title="网格视图" aria-label="网格视图">▦</button>
        <button class="vt" id="vt-list" type="button" title="列表视图" aria-label="列表视图">☰</button>
      </div>
    </div>

    <div class="listbar">
      <p class="listbar__count" id="count-line">共呈现 0 位博主归档</p>
      <label class="select">
        <span class="sr-only">排序方式</span>
        <select id="sort">
          <option value="followers-desc">粉丝数从高到低</option>
          <option value="followers-asc">粉丝数从低到高</option>
          <option value="heat-desc">热度(点击)从高到低</option>
          <option value="name-asc">名称 (A → Z)</option>
          <option value="added-desc">归档时间最近</option>
          <option value="added-asc">归档时间最早</option>
        </select>
      </label>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty" id="empty" hidden>
      <h3 id="empty-title">画廊还是空的</h3>
      <p class="muted" id="empty-text">换个关键词,或点「全部」重置筛选。</p>
    </div>

    <div class="more" id="more-wrap" hidden>
      <button class="btn btn--ghost" id="btn-more" type="button">加载更多</button>
    </div>
  </section>

</main>

<footer class="footer">
  <p>
    StarVault · X 博主精选画廊 · 数据快照版本 <span id="foot-version">—</span> ·
    本地优先:增删改只存于本机浏览器,不抓取第三方数据、不托管任何媒体文件。
  </p>
</footer>

<!-- 详情弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <button class="modal__close icon-btn" id="btn-modal-close" type="button" aria-label="关闭">×</button>
    <div id="modal-body"></div>
  </div>
</div>


<div class="toast" id="toast" hidden></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
